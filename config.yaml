# =====================================================================
# UniForensic - N1: Planted-evidence validation of forensic explanations
# All experiment settings live here. Change values HERE, never in code.
# =====================================================================

seed: 2026                      # master seed -> every random step derives from it

paths:
  data: data                    # generated benchmark (artifacts + answer key)
  models: models                # trained models + scaler
  results: results              # explanation scores, tables
  figures: figures              # plots for the paper

# ---------------- Benchmark generation (Step 3) ----------------------
benchmark:
  classes: [benign, fraud, harassment, cybercrime]
  tiers: [easy, mixed, subtle]
  # cases per (class x tier) in each split
  n_per_class_tier:
    train: 200                  # 4 classes x 3 tiers x 200 = 2400 cases
    val: 50                     # 600 cases (used for early stopping only)
    test: 50                    # 600 cases (used ONLY for final numbers)
  window_days: 30               # each case covers 30 days of device activity

  # background activity per case: uniform range [low, high] of artifact counts
  background:
    sms: [40, 150]
    calls: [20, 80]
    web: [50, 250]
    logins: [10, 40]
    transactions: [5, 30]

  # Planted decisive evidence strength per tier.
  # n_patterns = how many of the 3 class patterns are planted.
  # intensity  = [low, high] number of artifacts per planted pattern.
  # distractor = probability of adding a weak pattern from ANOTHER class.
  tier_settings:
    easy:   {n_patterns: 3, intensity: [12, 20], distractor_prob: 0.0, distractor_intensity: [0, 0],  background_scale: 1.0}
    mixed:  {n_patterns: 3, intensity: [6, 12],  distractor_prob: 1.0, distractor_intensity: [3, 7],  background_scale: 1.3}
    subtle: {n_patterns: 2, intensity: [3, 6],   distractor_prob: 0.7, distractor_intensity: [2, 5],  background_scale: 1.6}
  # benign cases also receive weak look-alikes (1-2 patterns of ONE offence class),
  # so "any suspicious artifact => crime" is not learnable. Innocent people do
  # sometimes look suspicious; this makes the subtle tier genuinely hard.
  benign_distractor_prob: 0.6
  benign_distractor_patterns: [1, 2]
  benign_distractor_intensity: [2, 6]

# ---------------- Models (Step 6) -----------------------------------
mlp:
  hidden: [64, 32]
  dropout: 0.1
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 150
  patience: 15                  # early stopping on validation loss

xgboost:
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.1
  subsample: 0.9
  colsample_bytree: 0.9

# ---------------- Oracle check (Step 7) -----------------------------
oracle:
  # a case passes if the model is correct AND removing the planted evidence
  # (re-extracting features without those artifacts) lowers the true-class
  # probability by at least this much
  min_prob_drop: 0.5

# ---------------- Explainers (Step 8) -------------------------------
explainers:
  kernelshap: {nsamples: 2048, background_size: 50}
  integrated_gradients: {n_steps: 64}
  gradientshap: {n_samples: 64, background_size: 50}
  lime: {n_samples: 1000}
  feature_ablation: {}
  random: {}                    # sanity floor: random attributions

# ---------------- Scoring (Step 9) ----------------------------------
scoring:
  k_fixed: 5                    # top-k used for precision@5 / recall@5 / agreement
  bootstrap: 1000               # resamples for 95% confidence intervals

# ---------------- F-Fidelity (Step 10) -------------------------------
# Zheng et al., ICLR 2025: fine-tune a surrogate with random masking (ratio beta),
# then remove explanation-ranked features stochastically, N samples per case.
ffidelity:
  beta: 0.1                     # paper default
  alpha: 0.5                    # paper default (alpha+ = alpha- = 0.5)
  n_samples: 50                 # paper default N
  s_top: 5                      # number of top-ranked features considered
  finetune_epochs: 60

# ---------------- Scaffold attack (Step 12, optional) ----------------
scaffold:
  cases_per_tier: 50            # oracle-passed cases attacked per tier

# ---------------- Acceptance test (Step 11) -------------------------
# FIXED BEFORE ANY RESULT IS SEEN. Script 01 records a hash of this block in
# results/frozen_thresholds.json; script 09 refuses to run if it changed.
acceptance:
  # Level 1 - METHOD validation on the benchmark (uses ground truth, done once):
  method_min_recall: 0.70       # mean strict recall@|G| must reach this on EVERY tier
  method_ffid_beats_random: true  # FFid+ 95% CI must lie above the random explainer's
  # Level 2 - CASE check, usable on real cases (NO ground truth needed):
  primary_explainer: kernelshap
  secondary_explainer: integrated_gradients   # different family (sampling vs gradient)
  case_min_agreement: 0.60      # top-5 feature agreement between the two (>= 3 of 5 shared)
  # Policy: of the explanations we label VALIDATED, at least this share must be
  # correct. The model-confidence cut-off that achieves it is CALIBRATED ON THE
  # VALIDATION SPLIT by script 09 and then applied unchanged to the test split.
  target_precision: 0.95
  confidence_grid: [0.50, 0.60, 0.70, 0.80, 0.90, 0.95, 0.97, 0.99, 0.995, 0.999]
  # "correct" = recall@|G| >= this (judged with the hidden answer key)
  good_explanation_recall: 0.66 # 2/3 = 0.667 passes; 1/2 = 0.5 fails
